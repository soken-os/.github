[project]
name = "cec-phase0"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["dbos>=2.11,<3", "jsonschema>=4.23,<5", "psycopg[binary]>=3.2,<4", "pytest>=8,<9", "mypy>=1.10,<3", "ruff>=0.4,<1"]

[tool.setuptools]
packages = []

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["../../.."]
testpaths = ["tests"]
markers = ["postgres: requires the local Phase-0 Postgres container"]
